[package]
name = "unilink-tunnel"
description = "ULP tunnel: TUN device (Linux/macOS/Windows), NullTun, dual-stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
unilink-protocol = { path = "../protocol" }

# Windows-only TUN API bindings (never compiled on Linux/macOS CI).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_Networking_Tun",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
] }
